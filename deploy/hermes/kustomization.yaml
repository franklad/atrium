apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes

resources:
  - 00-namespace.yaml
  - 10-pvc.yaml
  - 20-config.yaml
  - 40-deployment.yaml
  - 50-service.yaml
  - 60-ingress.yaml

# Generate the hermes-soul ConfigMap from SOUL.md so the markdown stays
# the single source of truth (no inlined copy in a manifest to drift).
configMapGenerator:
  - name: hermes-soul
    files:
      - SOUL.md

# Don't suffix the ConfigMap name with a content hash — the Deployment
# references `hermes-soul` by stable name. Hermes' bootstrap-home init
# container is `cp -n`, so it only seeds on first boot anyway.
generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: atrium
    includeSelectors: false
