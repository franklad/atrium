# cluster.config.example.yaml
#
# Template for the per-host config that drives an atrium install.
# Copy this to `cluster.config.yaml` (which is gitignored) and fill in
# your values.
#
#   cp cluster.config.example.yaml cluster.config.yaml
#   $EDITOR cluster.config.yaml
#
# This file carries cluster identity, not secrets. Real secrets (age
# private key, Cloudflare token, Tailscale OAuth client, future
# provider keys) live in Kubernetes Secrets — see §6 of
# docs/architecture.md.
#
# What's NOT here: model provider config. That's Hermes-native — once
# the cluster is up, configure providers via the Hermes dashboard or
# `hermes auth add` from inside the pod. Atrium doesn't manage it.

cluster:
  # A short, lowercase, DNS-safe name for this cluster.
  name: my-atrium

  # The public domain the cluster will serve under. Wildcard cert
  # `*.<this>` is issued by cert-manager via Cloudflare DNS-01.
  domain: example.com

  # Identity of the single node that runs k3s. Used as --tls-san
  # entries on the k3s install command.
  node:
    hostname: node-01           # the host's hostname
    mesh_ip:  100.64.0.1        # the node's private-mesh IP (e.g. tailnet CGNAT)
    lan_ip:   192.168.1.10      # the node's LAN IP

# Private-mesh ingress. Tailscale is the default; Headscale slots in
# identically. See §8 of docs/architecture.md.
mesh:
  kind: tailscale               # tailscale | headscale
  # The MagicDNS suffix for your tailnet (e.g. tail<id>.ts.net).
  # Find with: `tailscale status --json | jq -r '.MagicDNSSuffix'`
  magic_dns_suffix: tailXXXXXX.ts.net
  # Hostname for the Hermes dashboard's tailnet device, if you ever
  # expose it via the Tailscale Operator. Current goal-1 setup uses
  # public DNS + CGNAT IP instead, but the field is here for future
  # variants.
  hermes_hostname: hermes

# SOPS / age. The private key is NOT in this file — it lives at
# ~/.config/sops/age/keys.txt on your workstation and is loaded into
# the cluster's flux-system/sops-age Secret during bootstrap.
age:
  # The public recipient line from your age keypair (the line
  # starting with `age1...`). Used by `sops` to encrypt secrets.
  recipient: age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# ACME (Let's Encrypt) account contact for cert expiry warnings and
# policy notices. cert-manager registers an account with this email
# on first issuance and reuses it after.
acme:
  email: you@example.com

# Per-app overrides for `scripts/apply-app.sh`. Each entry is optional;
# omit to use the default conventions in docs/app-conventions.md.
#
# apps:
#   gustus:
#     fe_hostname: gustus           # → gustus.${cluster.domain}
#     be_hostname: api.gustus       # → api.gustus.${cluster.domain}
